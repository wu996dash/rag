  type: answerable
  expected_articles: [劳动争议解释一第36条]
  key_points: [月平均工资的百分之三十, 不低于最低工资标准, 按月支付]
- id: LD-008
  question: 公司三个月没发竞业限制补偿，我还需要遵守协议吗
  type: answerable
  expected_articles: [劳动争议解释一第38条]
  key_points: [三个月未支付经济补偿, 劳动者请求解除竞业限制约定人民法院应予支持]
- id: C-006
  question: 七级伤残能拿到哪些一次性补助
  type: answerable
  expected_articles: [工伤保险条例第37条]
  key_points: [一次性伤残补助金, 解除或终止劳动合同时一次性工伤医疗补助金和伤残就业补助金]
